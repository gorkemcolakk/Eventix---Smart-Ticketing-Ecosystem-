<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | EVENTIX</title>
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/components.css">
  <style>
    .cart-page { padding: 100px 0 60px; min-height: calc(100vh - 80px); }
    .cart-container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 30px; }
    @media (max-width: 768px) {
      .cart-container { grid-template-columns: 1fr; }
      .cart-page { padding: 80px 0 40px; }
    }
    @media (max-width: 480px) {
      .cart-page { padding: 70px 0 30px; }
      .cart-item { flex-wrap: wrap; gap: 12px; padding: 14px; }
      .cart-item img { width: 70px; height: 70px; }
      .cart-item-title { font-size: 1rem; }
      .cart-summary { position: static !important; }
    }
    .cart-item {
      display: flex; gap: 20px; background: var(--bg-surface);
      border: 1px solid var(--border-color); border-radius: 12px; padding: 20px;
      margin-bottom: 20px; align-items: center; position: relative;
    }
    .cart-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .cart-item-details { flex: 1; min-width: 0; }
    .cart-item-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text); word-break: break-word; }
    .cart-item-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .cart-qty-control { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .cart-qty-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: var(--text); width: 30px; height: 30px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .cart-qty-btn:hover { background: var(--accent-purple); border-color: var(--accent-purple); }
    .cart-remove { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ef4444; cursor: pointer; padding: 5px; opacity: 0.7; transition: 0.2s; }
    .cart-remove:hover { opacity: 1; transform: scale(1.1); }
    .cart-summary { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; position: sticky; top: 100px; height: fit-content; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-muted); }
    .summary-total { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 5px; font-weight: 700; font-size: 1.25rem; color: var(--text); }
    .reservation-timer {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(251,191,36,0.08));
      border: 1px solid rgba(251,191,36,0.4);
      border-radius: 8px;
      padding: 8px 14px;
      margin-top: 10px;
      animation: pulse-cart 2s ease-in-out infinite;
    }
    .reservation-timer.expired {
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.5);
      animation: none;
    }
    .reservation-timer .timer-count {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 1px;
    }
    .reservation-timer.expired .timer-count { color: #ef4444; }
    @keyframes pulse-cart {
      0%,100% { border-color: rgba(251,191,36,0.4); }
      50% { border-color: rgba(251,191,36,0.8); box-shadow: 0 0 8px rgba(251,191,36,0.2); }
    }
  </style>
</head>
<body>
  <nav class="navbar scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#gd)" stroke-width="2"><defs><linearGradient id="gd" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient></defs><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <span>EVENT<span class="logo-highlight">IX</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Explore</a></li>
      </ul>
      <div class="user-controls">
        <span id="navAuthArea"></span>
      </div>
    </div>
  </nav>

  <main class="container cart-page">
    <h1 style="margin-bottom: 30px; font-size: 2rem;">Your Cart</h1>
    
    <div class="cart-container" id="cartContainer" style="display: none;">
      <div class="cart-items" id="cartItemsList">
        <!-- Rendered by JS -->
      </div>
      
      <div class="cart-summary">
        <h3 style="margin-bottom: 20px;">Order Summary</h3>
        <div id="summaryRows"></div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="cartTotal" style="color:var(--accent-teal);">0 ₺</span>
        </div>
        <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 20px; padding: 14px;" onclick="proceedToCheckout()">
          Proceed to Checkout &rarr;
        </button>
      </div>
    </div>

    <div id="emptyCart" style="text-align: center; padding: 60px 20px; background: var(--bg-surface); border-radius: 16px; display: none;">
      <div style="font-size: 4rem; margin-bottom: 20px; filter: grayscale(1) opacity(0.5);">🛒</div>
      <h2>Your cart is empty</h2>
      <p style="color: var(--text-muted); margin-bottom: 30px;">Looks like you haven't added any tickets yet.</p>
      <a href="index.html" class="btn btn-primary" style="display: inline-flex;">Discover Events</a>
    </div>
  </main>

  <script src="./scripts/auth.js"></script>
  <script>
    // Sepetteki rezervasyon sayaçları
    const cartTimerIntervals = [];

    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
    });

    function changeQty(index, delta) {
      const cart = window.getCart();
      if(!cart[index]) return;
      if (cart[index].tickets_info && cart[index].tickets_info.length > 0) {
        alert("This item has pre-assigned seats and names. If you wish to change the quantity, please remove the item and add it again.");
        return;
      }
      if(cart[index].has_seating && delta > 0) {
        alert("For seated events, please edit items at checkout or add again from event page.");
        return;
      }
      cart[index].qty += delta;
      if(cart[index].qty < 1) cart.splice(index, 1);
      window.saveCart(cart);
    }

    async function removeItem(index) {
      // Timer'ı temizle
      if (cartTimerIntervals[index]) {
        clearInterval(cartTimerIntervals[index]);
        delete cartTimerIntervals[index];
      }
      const cart = window.getCart();
      const item = cart[index];
      
      if (item && item.has_seating && item.tickets_info) {
          for (let t of item.tickets_info) {
              if (t.seat_id) {
                  try {
                      await fetch('/api/tickets/unlock-seat', {
                          method: 'POST',
                          headers: {
                              'Content-Type': 'application/json',
                              'X-Session-ID': window.getOrCreateSessionId()
                          },
                          body: JSON.stringify({ seat_id: t.seat_id })
                      });
                  } catch (e) {}
              }
          }
      }
      
      cart.splice(index, 1);
      window.saveCart(cart);
    }

    function startCartItemTimer(idx, expiryMs) {
      if (!expiryMs) return;
      if (cartTimerIntervals[idx]) clearInterval(cartTimerIntervals[idx]);
      
      function tick() {
        const timerEl = document.getElementById('cart-timer-' + idx);
        const timerBox = document.getElementById('cart-timer-box-' + idx);
        if (!timerEl || !timerBox) { clearInterval(cartTimerIntervals[idx]); return; }
        
        const remaining = expiryMs - Date.now();
        if (remaining <= 0) {
          clearInterval(cartTimerIntervals[idx]);
          timerEl.textContent = '00:00';
          timerBox.classList.add('expired');
          timerBox.querySelector('.timer-label').textContent = 'Reservation expired!';
          // Expired item'ı sepetten kaldır
          setTimeout(async () => {
            const cart = window.getCart();
            if (cart[idx] && cart[idx].reservationExpiry === expiryMs) {
              const item = cart[idx];
              if (item.has_seating && item.tickets_info) {
                  for (let t of item.tickets_info) {
                      if (t.seat_id) {
                          try {
                              await fetch('/api/tickets/unlock-seat', {
                                  method: 'POST',
                                  headers: {
                                      'Content-Type': 'application/json',
                                      'X-Session-ID': window.getOrCreateSessionId()
                                  },
                                  body: JSON.stringify({ seat_id: t.seat_id })
                              });
                          } catch (e) {}
                      }
                  }
              }
              cart.splice(idx, 1);
              window.saveCart(cart);
              renderCart();
              alert('A seat reservation in your cart has expired and was removed.');
            }
          }, 1500);
          return;
        }
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        timerEl.textContent = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
      }
      tick();
      cartTimerIntervals[idx] = setInterval(tick, 1000);
    }

    function renderCart() {
      // Önceki timer'ları temizle
      cartTimerIntervals.forEach(id => clearInterval(id));
      cartTimerIntervals.length = 0;

      const cart = window.getCart();
      if (cart.length === 0) {
        document.getElementById('cartContainer').style.display = 'none';
        document.getElementById('emptyCart').style.display = 'block';
        return;
      }

      document.getElementById('cartContainer').style.display = 'grid';
      document.getElementById('emptyCart').style.display = 'none';

      const list = document.getElementById('cartItemsList');
      const sumRows = document.getElementById('summaryRows');
      list.innerHTML = '';
      sumRows.innerHTML = '';
      let total = 0;

      cart.forEach((item, idx) => {
        const isSelected = item._selected !== false;
        // Koltuklu etkinlikte totalPrice kullan, yoksa price * qty
        const itemTotal = item.totalPrice != null ? item.totalPrice : (item.price * item.qty);
        if (isSelected) {
            total += itemTotal;
        }

        // Koltuk etiketlerini göster
        const seatLabels = item.tickets_info && item.tickets_info.length > 0 && item.has_seating
          ? item.tickets_info.map(t => t.seatLabel || '').filter(Boolean)
          : [];

        // Rezervasyon sayacı HTML'i
        let timerHtml = '';
        if (item.reservationExpiry && item.has_seating) {
          const timeLeft = item.reservationExpiry - Date.now();
          if (timeLeft > 0) {
            const m = Math.floor(timeLeft / 60000);
            const s = Math.floor((timeLeft % 60000) / 1000);
            timerHtml = `
              <div id="cart-timer-box-${idx}" class="reservation-timer">
                <span>⏳</span>
                <span class="timer-label" style="font-size:0.8rem; color:rgba(251,191,36,0.9); font-weight:600;">Seats reserved for</span>
                <span id="cart-timer-${idx}" class="timer-count">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>
              </div>`;
          } else {
            timerHtml = `<div class="reservation-timer expired"><span>⚠️</span><span style="font-size:0.8rem; color:#ef4444;">Reservation expired</span></div>`;
          }
        }

        list.innerHTML += `
          <div class="cart-item" style="${!isSelected ? 'opacity: 0.6; background: rgba(0,0,0,0.05);' : ''} padding-left: 50px;">
            <input type="checkbox" class="cart-item-check" ${isSelected ? 'checked' : ''} onchange="toggleItemSelection(${idx})" style="position: absolute; left: 16px; top: 20px; width: 22px; height: 22px; cursor: pointer; accent-color: var(--accent-purple);">
            <button class="cart-remove" onclick="removeItem(${idx})" title="Remove item">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <img src="${item.image}" alt="" style="${!isSelected ? 'filter: grayscale(0.8);' : ''}">
            <div class="cart-item-details">
              <div class="cart-item-title">${item.title}</div>
              <div class="cart-item-meta">Unit Price: ${item.price.toLocaleString()} ₺</div>
              ${item.has_seating ? '<div class="cart-item-meta" style="color:var(--accent-purple); font-weight:700; margin-bottom:10px;">🎟️ Seated Event</div>' : ''}
              ${item.tickets_info && item.tickets_info.length > 0 ? 
                `<ul style="list-style:none; padding:0; margin:10px 0; display:flex; flex-direction:column; gap:8px;">
                  ${item.tickets_info.map(t => `
                    <li style="font-weight:600; font-size:0.9rem; padding:10px 14px; background:var(--bg-surface); border:1px solid var(--border-color); border-left:4px solid var(--accent-purple); border-radius:8px; color:var(--text); display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
                      <span style="color:var(--accent-teal); white-space:nowrap;">🪑 Seat: ${t.seatLabel || 'N/A'}</span> 
                      <span style="opacity:0.3; margin:0 2px;">|</span> 
                      <span style="white-space:nowrap;">👤 Reserved: ${t.name} ${t.surname}</span>
                    </li>
                  `).join('')}
                 </ul>
                 <div class="cart-qty-control" style="margin-top:12px;">
                   <span style="font-weight:600; background:var(--bg-surface); border:1px solid var(--border-color); padding:6px 14px; border-radius:6px; color:var(--text);">Quantity: ${item.qty}</span>
                 </div>` 
                : 
                `<div class="cart-qty-control">
                  <button class="cart-qty-btn" onclick="changeQty(${idx}, -1)">–</button>
                  <span style="width: 20px; text-align: center; color:var(--text); font-weight:600;">${item.qty}</span>
                  <button class="cart-qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                </div>`
              }
              ${timerHtml}
            </div>
            <div style="font-weight: 700; font-size: 1.1rem; ${!isSelected ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${itemTotal.toLocaleString()} ₺</div>
          </div>
        `;

        if (isSelected) {
            sumRows.innerHTML += `
              <div class="summary-row">
                <span>${item.qty}x ${item.title}</span>
                <span>${itemTotal.toLocaleString()} ₺</span>
              </div>
            `;
        }
      });

      document.getElementById('cartTotal').textContent = total.toLocaleString() + ' ₺';

      // DOM render sonrası timer'ları başlat
      cart.forEach((item, idx) => {
        if (item.reservationExpiry && item.has_seating && (item.reservationExpiry - Date.now()) > 0) {
          startCartItemTimer(idx, item.reservationExpiry);
        }
      });
    }

    function toggleItemSelection(idx) {
      const cart = window.getCart();
      if (cart[idx]) {
        cart[idx]._selected = cart[idx]._selected === false ? true : false;
        window.saveCart(cart);
      }
    }

    function proceedToCheckout() {
      const cart = window.getCart();
      const selectedIndices = [];
      cart.forEach((item, idx) => {
         if (item._selected !== false) selectedIndices.push(idx);
      });

      if (selectedIndices.length === 0) {
         alert("Please select at least one item to proceed to checkout.");
         return;
      }

      // Süresi dolmuş koltuklu kalemleri kontrol et (sadece seçili olanlar)
      const expiredItem = cart.find((item, idx) => selectedIndices.includes(idx) && item.has_seating && item.reservationExpiry && item.reservationExpiry < Date.now());
      if (expiredItem) {
        alert(`The seat reservation for "${expiredItem.title}" has expired. Please reselect your seats.`);
        return;
      }
      
      sessionStorage.setItem('checkout_indices', JSON.stringify(selectedIndices));
      window.location.href = 'cart-checkout.html';
    }
    window.renderCart = renderCart;
  </script>
</body>
</html>
